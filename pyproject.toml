[project]
name = "mcp-demo"
version = "0.1.0"
description = "MCP demo, proof of concept project to help me learn how to build MCP-integrated applications"
readme = "README.md"
authors = [
    { name = "Yilei Bai", email = "yilei.bai@va.gov" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "flask>=3.1.3",
    "httpx2>=2.16.2",
    "mcp[cli]>=2.3.0",
    "pytest>=9.2.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "flask>=3.1.3",
    "httpx2>=2.16.2",
    "mcp[cli]>=2.3.0",
    "pytest>=9.2.0",
]

[project.scripts]
mcp-demo = "mcp_demo:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]